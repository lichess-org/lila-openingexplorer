get:
  operationId: openingExplorerLichessHistory
  summary: Lichess games history
  description: |
    **Endpoint: <https://explorer.lichess.org/lichess/history>**

    Like [Lichess games](#tag/opening-explorer/GET/lichess) with
    `history=true`, but only the totals and the history: `moves`,
    `topGames` and `recentGames` are empty.

    Example: `curl https://explorer.lichess.org/lichess/history?play=e2e4,e7e5&speeds=blitz&ratings=2200,2500`
  tags:
    - Opening Explorer
  servers:
    - url: https://explorer.lichess.org
    - url: http://localhost:{port}
      variables:
        port:
          default: "9002"
  security:
    - OAuth2: []
  parameters:
    - in: query
      name: variant
      description: Variant
      schema:
        $ref: "../../schemas/VariantKey.yaml"
        default: standard
    - in: query
      name: fen
      description: X-FEN or EPD of the root position
      schema:
        type: string
      example: rnbqkbnr/ppp1pppp/8/3pP3/8/8/PPPP1PPP/RNBQKBNR b KQkq - 0 2
    - in: query
      name: play
      description: |
        Comma separated sequence of legal moves in UCI notation.
        Play additional moves starting from `fen`.
        Required to find an opening name, if `fen` is not an exact match
        for a named position.
      schema:
        type: string
        default: ""
      example: d2d4,d7d5,c2c4,c7c6,c4d5
    - in: query
      name: speeds
      description: Comma separated list of game speeds to filter by
      schema:
        type: array
        items:
          $ref: "../../schemas/Speed.yaml"
    - in: query
      name: ratings
      description: |
        Comma separated list of ratings groups to filter by.
        Each group ranges from its value to the next higher
        group in the enum (`0` from 0 to 999, `1000` from 1000 to 1199,
        ..., `2500` from 2500 to any rating above).
      schema:
        type: array
        items:
          type: integer
          enum:
            - 0
            - 1000
            - 1200
            - 1400
            - 1600
            - 1800
            - 2000
            - 2200
            - 2500
    - in: query
      name: since
      description: |
        Include only games from this month or later: `YYYY-MM`, or `YYYY`
        for January of that year
      schema:
        type: string
        default: 1952-01
    - in: query
      name: until
      description: |
        Include only games from this month or earlier: `YYYY-MM`, or `YYYY`
        for December of that year
      schema:
        type: string
        default: 3000-12
  responses:
    "200":
      description: Totals and monthly history of games in the position.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            default: "'*'"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../schemas/OpeningExplorerLichess.yaml"
              - required:
                  - history
          examples:
            default:
              $ref: "../../examples/openingExplorer-lichessHistory.json.yaml"
    "400":
      description: Invalid parameters, position or moves.
      content:
        text/plain:
          schema:
            type: string
          example: "bad request: illegal move e2e5: illegal uci move"
